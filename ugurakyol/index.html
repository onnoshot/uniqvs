*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0b;--panel:#121214;--line:rgba(243,240,234,.12);--ink:#f3f0ea;--mute:#8d887f;--red:#cc1c1c;--red2:#e5484d}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px 16px;position:relative;overflow:hidden}

p{color:var(--mute);font-size:15px;margin-top:8px;line-height:1.5}
form{margin-top:26px;display:flex;flex-direction:column;gap:12px}
input{width:100%;background:#0a0a0b;border:1px solid var(--line);color:var(--ink);font-size:17px;padding:14px 16px;border-radius:14px;outline:none;font-family:inherit}
input:focus{border-color:rgba(229,72,77,.6)}
button{background:var(--red);color:#fff;border:0;font-size:16px;font-weight:600;padding:14px;border-radius:14px;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--red2);font-size:14px;min-height:20px}
.foot{margin-top:22px;font-size:13px;color:var(--mute)}
</style>

function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function norm(s){return s.trim().toLocaleLowerCase('tr').normalize('NFC').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ç/g,'c')}
async function open(pw){
  var c=crypto.subtle;

  return new TextDecoder().decode(pt);
}
